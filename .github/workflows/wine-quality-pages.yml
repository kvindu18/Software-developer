name: Deploy Wine Quality site
on:
  push:
    branches: [main]
    paths: ['wine-quality/**','.github/workflows/wine-quality-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './wine-quality'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
